<script>

/*
==========================================================
TMDB SETUP
==========================================================

IMPORTANT:

Replace the text below with your actual TMDB
API Read Access Token.

Example:

const TMDB_READ_ACCESS_TOKEN =
"eyJhbGciOiJIUzI1NiJ9.......";

DO NOT use:

developer.themoviedb.org

That is only the documentation website.
==========================================================
*/

const TMDB_READ_ACCESS_TOKEN =
    "PASTE_YOUR_TMDB_READ_ACCESS_TOKEN_HERE";


const movieContainer =
    document.getElementById("movieContainer");

const movieStatus =
    document.getElementById("movieStatus");

const movieSearch =
    document.getElementById("movieSearch");

const movieModal =
    document.getElementById("movieModal");

const trailerFrame =
    document.getElementById("trailerFrame");

const movieClose =
    document.getElementById("movieClose");


let allMovies = [];


/* =========================
   DATE
========================= */

function movieDate(date) {

    if (!date) {
        return "Release date: N/A";
    }

    const d = new Date(date);

    if (isNaN(d.getTime())) {
        return "Release date: N/A";
    }

    return "📅 " + d.toLocaleDateString(
        "en-US",
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );

}


/* =========================
   RATING
========================= */

function movieRating(rating) {

    if (
        rating === null ||
        rating === undefined ||
        isNaN(rating)
    ) {

        return "⭐ N/A";

    }

    return "⭐ " +
        Number(rating).toFixed(1);

}


/* =========================
   FIND YOUTUBE TRAILER
========================= */

function findYoutubeTrailer(videos) {

    if (
        !videos ||
        !videos.results ||
        videos.results.length === 0
    ) {

        return null;

    }


    const youtubeVideos =
        videos.results.filter(function(video) {

            return (
                video.site === "YouTube" &&
                video.key
            );

        });


    if (youtubeVideos.length === 0) {

        return null;

    }


    /*
      First preference:
      Official Trailer
    */

    const officialTrailer =
        youtubeVideos.find(function(video) {

            return (
                video.official === true &&
                video.type === "Trailer"
            );

        });


    if (officialTrailer) {

        return officialTrailer.key;

    }


    /*
      Second preference:
      Any Trailer
    */

    const trailer =
        youtubeVideos.find(function(video) {

            return video.type === "Trailer";

        });


    if (trailer) {

        return trailer.key;

    }


    /*
      Third preference:
      Teaser
    */

    const teaser =
        youtubeVideos.find(function(video) {

            return video.type === "Teaser";

        });


    if (teaser) {

        return teaser.key;

    }


    return youtubeVideos[0].key;

}


/* =========================
   ESCAPE HTML
========================= */

function movieEscape(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   RENDER MOVIES
========================= */

function renderMovies(movies) {

    movieContainer.innerHTML = "";


    if (!movies || movies.length === 0) {

        movieContainer.innerHTML =
            "<p>No movies found.</p>";

        return;

    }


    movies.forEach(function(movie) {

        const poster =
            movie.poster_path
                ? "https://image.tmdb.org/t/p/w500" +
                  movie.poster_path
                : "https://via.placeholder.com/500x750?text=No+Poster";


        const title =
            movieEscape(movie.title || "Untitled");


        const overview =
            movieEscape(
                movie.overview ||
                "No description available."
            );


        const releaseDate =
            movieDate(movie.release_date);


        const rating =
            movieRating(movie.vote_average);


        const card =
            document.createElement("div");

        card.className = "movie-card";


        card.innerHTML = `

            <img
                class="movie-poster"
                src="${poster}"
                alt="${title}"
                loading="lazy"
            >

            <div class="movie-info">

                <div class="movie-title">
                    ${title}
                </div>

                <div class="movie-meta">
                    ${releaseDate}
                    <br>
                    ${rating}
                </div>

                <div class="movie-overview">
                    ${overview}
                </div>

                ${
                    movie.trailer
                    ?

                    `
                    <button
                        class="trailer-btn"
                        data-trailer="${movie.trailer}"
                    >
                        ▶ Watch Trailer
                    </button>
                    `

                    :

                    `
                    <button
                        class="trailer-btn"
                        disabled
                        style="opacity:.5;cursor:not-allowed;"
                    >
                        Trailer Not Available
                    </button>
                    `
                }

            </div>

        `;


        const trailerButton =
            card.querySelector(".trailer-btn");


        if (
            trailerButton &&
            movie.trailer
        ) {

            trailerButton.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();

                    openTrailer(movie.trailer);

                }
            );

        }


        movieContainer.appendChild(card);

    });

}


/* =========================
   GET MOVIE DETAILS
========================= */

async function getMovieDetails(movie) {

    try {

        const url =
            "https://api.themoviedb.org/3/movie/" +
            movie.id +
            "?append_to_response=videos&language=en-US";


        const response =
            await fetch(url, {

                headers: {

                    "Authorization":
                        "Bearer " +
                        TMDB_READ_ACCESS_TOKEN,

                    "accept":
                        "application/json"

                }

            });


        if (!response.ok) {

            throw new Error(
                "TMDB API error: " +
                response.status
            );

        }


        const data =
            await response.json();


        return {

            ...movie,

            trailer:
                findYoutubeTrailer(data.videos)

        };

    }

    catch (error) {

        console.error(
            "Movie details error:",
            error
        );


        return {

            ...movie,

            trailer: null

        };

    }

}


/* =========================
   LOAD MOVIES
========================= */

async function loadMovies() {

    if (
        !TMDB_READ_ACCESS_TOKEN ||
        TMDB_READ_ACCESS_TOKEN ===
        "PASTE_YOUR_TMDB_READ_ACCESS_TOKEN_HERE"
    ) {

        movieStatus.innerHTML =
            "⚠️ Please add your TMDB API Read Access Token in the code.";

        return;

    }


    movieStatus.innerHTML =
        "⏳ Loading latest movies...";


    try {

        const today =
            new Date()
                .toISOString()
                .split("T")[0];


        const url =
            "https://api.themoviedb.org/3/discover/movie" +

            "?include_adult=false" +

            "&include_video=false" +

            "&language=en-US" +

            "&page=1" +

            "&sort_by=primary_release_date.desc" +

            "&release_date.lte=" +
            today +

            "&with_release_type=2|3|4";


        const response =
            await fetch(url, {

                headers: {

                    "Authorization":
                        "Bearer " +
                        TMDB_READ_ACCESS_TOKEN,

                    "accept":
                        "application/json"

                }

            });


        if (!response.ok) {

            throw new Error(
                "TMDB error: " +
                response.status
            );

        }


        const data =
            await response.json();


        let movies =
            data.results || [];


        /*
          Remove movies without release date
        */

        movies =
            movies.filter(function(movie) {

                return movie.release_date;

            });


        /*
          First 18 movies
        */

        movies =
            movies.slice(0, 18);


        movieStatus.innerHTML =
            "⏳ Loading movie trailers...";


        /*
          Get trailer information
        */

        allMovies =
            await Promise.all(
                movies.map(getMovieDetails)
            );


        renderMovies(allMovies);


        movieStatus.innerHTML =
            "🎬 Latest Movies";


    }

    catch (error) {

        console.error(
            "TMDB loading error:",
            error
        );


        movieStatus.innerHTML =
            "❌ Could not load movies. Please check your TMDB token.";

    }

}


/* =========================
   MOVIE SEARCH
========================= */

movieSearch.addEventListener(
    "input",
    function() {

        const value =
            movieSearch.value
                .toLowerCase()
                .trim();


        if (!value) {

            renderMovies(allMovies);

            return;

        }


        const filtered =
            allMovies.filter(function(movie) {

                return (
                    movie.title &&
                    movie.title
                        .toLowerCase()
                        .includes(value)
                );

            });


        renderMovies(filtered);

    }
);


/* =========================
   OPEN TRAILER
========================= */

function openTrailer(videoKey) {

    if (!videoKey) {
        return;
    }


    trailerFrame.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoKey) +
        "?autoplay=1";


    movieModal.style.display =
        "flex";

}


/* =========================
   CLOSE TRAILER
========================= */

function closeTrailer() {

    trailerFrame.src = "";

    movieModal.style.display =
        "none";

}


movieClose.addEventListener(
    "click",
    closeTrailer
);


movieModal.addEventListener(
    "click",
    function(event) {

        if (event.target === movieModal) {

            closeTrailer();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeTrailer();

        }

    }
);


/* =========================
   START MOVIE API
========================= */

loadMovies();

</script>

</body>

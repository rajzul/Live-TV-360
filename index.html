<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<style>

/* ============================= */
/* BASIC */
/* ============================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #fff;
    font-family: Arial, sans-serif;
}

/* ============================= */
/* HEADER */
/* ============================= */

header {
    background: #111;
    padding: 18px;
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    border-bottom: 1px solid #222;
}

/* ============================= */
/* MAIN CONTAINER */
/* ============================= */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 15px;
}

/* ============================= */
/* PLAYER */
/* ============================= */

.player-box {
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 25px rgba(0,0,0,.6);
}

video {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
    background: #000;
}

/* ============================= */
/* LOADING */
/* ============================= */

.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    font-size: 18px;
}

/* ============================= */
/* NOW PLAYING */
/* ============================= */

.now-playing {
    background: #111;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    margin-top: 2px;
}

/* ============================= */
/* ADS */
/* ============================= */

.ad-box {
    width: 100%;
    max-width: 728px;
    min-height: 90px;
    margin: 20px auto;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #111;
    border-radius: 8px;
}

.ad-box iframe {
    max-width: 100%;
    border: 0;
}

/* ============================= */
/* SEARCH */
/* ============================= */

.search {
    width: 100%;
    padding: 14px;
    margin: 18px 0;
    border: none;
    border-radius: 8px;
    background: #181818;
    color: white;
    font-size: 16px;
    outline: none;
}

.search::placeholder {
    color: #888;
}

/* ============================= */
/* CHANNELS */
/* ============================= */

.channels {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
}

/* ============================= */
/* CHANNEL */
/* ============================= */

.channel {
    background: #151515;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: .2s;
    text-align: center;
    border: 1px solid #222;
}

.channel:hover {
    transform: translateY(-3px);
    background: #222;
}

.channel.active {
    background: #d90000;
    border-color: #ff3333;
}

/* ============================= */
/* CHANNEL LOGO */
/* ============================= */

.logo {
    width: 65px;
    height: 65px;
    object-fit: contain;
    display: block;
    margin: auto;
    margin-bottom: 8px;
    background: #000;
    border-radius: 8px;
}

/* ============================= */
/* NEWS SECTION */
/* ============================= */

.news-section {
    margin-top: 35px;
    padding: 20px 0;
}

.news-section h2 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 20px;
}

.news-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
}

.news-card {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 12px;
    overflow: hidden;
}

.news-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
}

.news-content {
    padding: 15px;
}

.news-content h3 {
    margin: 0 0 10px;
    font-size: 20px;
}

.news-content p {
    color: #bbb;
    line-height: 1.6;
    font-size: 15px;
}

.news-content a {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 14px;
    background: #d90000;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

.news-content a:hover {
    background: #ff2222;
}

/* ============================= */
/* FOOTER */
/* ============================= */

footer {
    text-align: center;
    color: #777;
    padding: 30px;
}

/* ============================= */
/* MOBILE */
/* ============================= */

@media(max-width:600px) {

    header {
        font-size: 20px;
    }

    .channels {
        grid-template-columns: repeat(2, 1fr);
    }

    .channel {
        font-size: 14px;
    }

    .news-container {
        grid-template-columns: 1fr;
    }

    .ad-box {
        min-height: 50px;
        margin: 15px auto;
    }

}


/* =========================================================
   MOVIES - ADDED WITHOUT CHANGING THE EXISTING TV CODE
   ========================================================= */
.movie-section {
    margin-top: 35px;
    padding: 20px 0;
}
.movie-section h2 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 18px;
}
.movie-search {

}
.movie-search::placeholder { color: #888; }
.movie-status {
    text-align: center;
    color: #aaa;
    padding: 20px;
}
.movie-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
}
.movie-card {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 12px;
    overflow: hidden;
    transition: .2s;
}
.movie-card:hover {
    transform: translateY(-4px);
    background: #1d1d1d;
}
.movie-poster {
    width: 100%;
    height: 285px;
    object-fit: cover;
    display: block;
    background: #222;
}
.movie-info { padding: 13px; }
.movie-title {
    margin: 0 0 8px;
    font-size: 17px;
    line-height: 1.35;
}
.movie-meta {
    color: #bbb;
    font-size: 13px;
    line-height: 1.7;
}
.movie-overview {
    color: #aaa;
    font-size: 13px;
    line-height: 1.5;
    margin: 8px 0 10px;
}
.trailer-btn {
    display: inline-block;
    padding: 9px 13px;
    background: #d90000;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    border: 0;
}
.trailer-btn:hover { background: #ff2222; }

.movie-modal {
    display: none;
    position: fixed;
    z-index: 99999;
    inset: 0;
    background: rgba(0,0,0,.88);
    align-items: center;
    justify-content: center;
    padding: 18px;
}
.movie-modal-box {
    width: min(900px, 100%);
    background: #111;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
}
.movie-modal iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    display: block;
}
.movie-close {
    position: absolute;
    right: 10px;
    top: 7px;
    z-index: 2;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.75);
    color: #fff;
    font-size: 24px;
    cursor: pointer;
}
.tmdb-credit {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-top: 15px;
}
@media(max-width:600px) {
    .movie-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .movie-poster { height: 240px; }
    .movie-title { font-size: 15px; }
    .movie-overview { font-size: 12px; }
}

</style>

<script>

const channels = [

   {

     {

/* =========================================
   ELEMENTS
========================================= */

const video = document.getElementById("video");

const channelBox =
    document.getElementById("channels");

const nowPlaying =
    document.getElementById("nowPlaying");

const loading =
    document.getElementById("loading");

const search =
    document.getElementById("search");

let hls = null;


/* =========================================
   PLAY CHANNEL
========================================= */

function playChannel(channel, element) {

    nowPlaying.innerText =
        "🔴 LIVE — " + channel.name;


    document.querySelectorAll(".channel")
        .forEach(el => {

            el.classList.remove("active");

        });


    if (element) {

        element.classList.add("active");

    }


    loading.style.display = "block";


    /* Destroy old HLS */

    if (hls) {

        hls.destroy();

        hls = null;

    }


    /* Clear old video */

    video.pause();

    video.removeAttribute("src");

    video.load();


    /* ============================= */
    /* Safari / Native HLS */
    /* ============================= */

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = channel.url;


        video.play()
            .then(() => {

                loading.style.display = "none";

            })
            .catch(() => {

                loading.style.display = "none";

            });

    }


    /* ============================= */
    /* Chrome / Edge / Firefox */
    /* ============================= */

    else if (Hls.isSupported()) {

        hls = new Hls({

            enableWorker: true,

            lowLatencyMode: true,

            backBufferLength: 90

        });


        hls.loadSource(channel.url);


        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function () {

                loading.style.display = "none";

                video.play()
                    .catch(() => {});

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function (event, data) {

                console.log(
                    "HLS ERROR:",
                    data
                );


                if (data.fatal) {

                    loading.style.display = "none";

                    nowPlaying.innerText =
                        "⚠️ Stream cannot be played";

                }

            }
        );

    }


    else {

        loading.style.display = "none";

        alert(
            "Your browser does not support M3U8/HLS."
        );

    }

}


/* =========================================
   SHOW CHANNELS
========================================= */

function showChannels(list) {

    channelBox.innerHTML = "";


    if (list.length === 0) {

        channelBox.innerHTML =
            "<p>No channel found.</p>";

        return;

    }


    list.forEach(channel => {

        const div =
            document.createElement("div");


        div.className = "channel";


        div.innerHTML = `

            <img
                class="logo"
                src="${channel.logo}"
                onerror="this.style.display='none'"
                alt="${channel.name}"
            >

            <div>
                ${channel.name}
            </div>

        `;


        div.onclick = function () {

            playChannel(
                channel,
                div
            );

        };


        channelBox.appendChild(div);

    });

}


/* =========================================
   SEARCH
========================================= */

search.addEventListener(
    "input",
    function () {

        const keyword =
            search.value
                .toLowerCase()
                .trim();


        const filtered =
            channels.filter(channel =>

                channel.name
                    .toLowerCase()
                    .includes(keyword)

            );


        showChannels(filtered);

    }
);


/* =========================================
   START
========================================= */

showChannels(channels);

</script>



<!-- =========================================================
     MOVIE API JAVASCRIPT - ADDED SECTION
     ========================================================= -->
<script>
/*
 * 1) Create a TMDB account and request an API key.
 * 2) Paste your TMDB API key below.
 *
 * TMDB API documentation:
 * https://developer.themoviedb.org/docs/getting-started
 */
const TMDB_API_KEY = "PASTE_YOUR_TMDB_API_KEY_HERE";

const movieContainer = document.getElementById("movieContainer");
const movieStatus = document.getElementById("movieStatus");
const movieSearch = document.getElementById("movieSearch");
const movieModal = document.getElementById("movieModal");
const trailerFrame = document.getElementById("trailerFrame");
const movieClose = document.getElementById("movieClose");

let allMovies = [];

/* Escape text before putting API data into HTML */
function movieEscape(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function movieDate(date) {
    if (!date) return "Release date: N/A";

    const d = new Date(date + "T00:00:00");
    if (Number.isNaN(d.getTime())) {
        return "Release date: " + movieEscape(date);
    }

    return "Release date: " + d.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}

function movieRating(value) {
    const n = Number(value);
    return Number.isFinite(n) && n > 0
        ? "⭐ " + n.toFixed(1) + "/10"
        : "⭐ N/A";
}

function findYoutubeTrailer(videos) {
    if (!videos || !videos.results) return null;

    const list = videos.results;

    const officialTrailer = list.find(v =>
        v.site === "YouTube" &&
        v.type === "Trailer" &&
        v.official === true
    );

    if (officialTrailer) return officialTrailer;

    const anyTrailer = list.find(v =>
        v.site === "YouTube" &&
        v.type === "Trailer"
    );

    if (anyTrailer) return anyTrailer;

    return list.find(v =>
        v.site === "YouTube" &&
        (v.type === "Teaser" || v.type === "Clip")
    ) || null;
}

function renderMovies(list) {
    movieContainer.innerHTML = "";

    if (!list.length) {
        movieContainer.innerHTML =
            '<div class="movie-status">No movie found.</div>';
        return;
    }

    list.forEach(movie => {
        const poster = movie.poster_path
            ? "https://image.tmdb.org/t/p/w500" + movie.poster_path
            : "https://via.placeholder.com/500x750?text=No+Poster";

        const overview = movie.overview
            ? movie.overview.length > 140
                ? movie.overview.substring(0, 140) + "..."
                : movie.overview
            : "No description available.";

        const trailer = movie.trailer;

        const card = document.createElement("article");
        card.className = "movie-card";

        card.innerHTML = `
            <img
                class="movie-poster"
                src="${poster}"
                alt="${movieEscape(movie.title)}"
                loading="lazy"
                onerror="this.src='https://via.placeholder.com/500x750?text=No+Poster'"
            >

            <div class="movie-info">
                <h3 class="movie-title">
                    ${movieEscape(movie.title)}
                </h3>

                <div class="movie-meta">
                    📅 ${movieDate(movie.release_date)}
                    <br>
                    ${movieRating(movie.vote_average)}
                </div>

                <p class="movie-overview">
                    ${movieEscape(overview)}
                </p>

                ${
                    trailer
                    ? `<button class="trailer-btn" data-key="${movieEscape(trailer.key)}">
                         ▶ Watch Trailer
                       </button>`
                    : `<span class="movie-meta">Trailer not available</span>`
                }
            </div>
        `;

        const btn = card.querySelector(".trailer-btn");

        if (btn) {
            btn.addEventListener("click", () => {
                openTrailer(btn.dataset.key);
            });
        }

        movieContainer.appendChild(card);
    });
}

async function getMovieDetails(movie) {
    const url =
        "https://api.themoviedb.org/3/movie/" +
        movie.id +
        "?append_to_response=videos&language=en-US";

    const response = await fetch(url, {
        headers: {
            "Authorization": "Bearer " + TMDB_API_KEY,
            "accept": "application/json"
        }
    });

    if (!response.ok) {
        throw new Error("Movie details request failed: " + response.status);
    }

    const details = await response.json();

    return {
        ...movie,
        trailer: findYoutubeTrailer(details.videos)
    };
}

async function loadMovies() {
    if (
        !TMDB_API_KEY ||
        TMDB_API_KEY === "PASTE_YOUR_TMDB_API_KEY_HERE"
    ) {
        movieStatus.innerHTML =
            "⚠️ TMDB API key বসান। Code-এর উপরের TMDB_API_KEY অংশে আপনার key দিন।";
        return;
    }

    movieStatus.innerHTML = "⏳ Loading latest movies...";
    movieContainer.innerHTML = "";

    try {
        const today = new Date().toISOString().slice(0, 10);

        /*
         * Discover movies released recently.
         * Sorting is by primary release date, newest first.
         */
        const url =
            "https://api.themoviedb.org/3/discover/movie" +
            "?include_adult=false" +
            "&include_video=false" +
            "&language=en-US" +
            "&page=1" +
            "&sort_by=primary_release_date.desc" +
            "&release_date.lte=" + today +
            "&with_release_type=2|3|4";

        const response = await fetch(url, {
            headers: {
                "Authorization": "Bearer " + TMDB_API_KEY,
                "accept": "application/json"
            }
        });

        if (!response.ok) {
            throw new Error("Movie list request failed: " + response.status);
        }

        const data = await response.json();

        /*
         * Get trailer together with movie details.
         * Limit to 18 movies to reduce API requests.
         */
        const movies = (data.results || []).slice(0, 18);

        allMovies = await Promise.all(
            movies.map(movie =>
                getMovieDetails(movie).catch(() => ({
                    ...movie,
                    trailer: null
                }))
            )
        );

        movieStatus.innerHTML = "";
        renderMovies(allMovies);

    } catch (error) {
        console.error("Movie API error:", error);
        movieStatus.innerHTML =
            "❌ Movie data load হয়নি। API key বা API connection check করুন।";
    }
}

function openTrailer(youtubeKey) {
    if (!youtubeKey) return;

    trailerFrame.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(youtubeKey) +
        "?autoplay=1&rel=0";

    movieModal.style.display = "flex";
}

function closeTrailer() {
    movieModal.style.display = "none";
    trailerFrame.src = "";
}

movieClose.addEventListener("click", closeTrailer);

movieModal.addEventListener("click", function(event) {
    if (event.target === movieModal) {
        closeTrailer();
    }
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        closeTrailer();
    }
});

movieSearch.addEventListener("input", function() {
    const keyword = movieSearch.value.toLowerCase().trim();

    const filtered = allMovies.filter(movie =>
        (movie.title || "").toLowerCase().includes(keyword)
    );

    renderMovies(filtered);
});

/* Start movie system */
loadMovies();
</script>

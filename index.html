<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ============================= */
/* BASIC */
/* ============================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #fff;
    font-family: Arial, sans-serif;
}

/* ============================= */
/* HEADER */
/* ============================= */

header {
    background: #111;
    padding: 18px;
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    border-bottom: 1px solid #222;
}

/* ============================= */
/* MAIN CONTAINER */
/* ============================= */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 15px;
}

/* ============================= */
/* PLAYER */
/* ============================= */

.player-box {
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 25px rgba(0,0,0,.6);
}

video {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
    background: #000;
}

/* ============================= */
/* LOADING */
/* ============================= */

.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    font-size: 18px;
}

/* ============================= */
/* NOW PLAYING */
/* ============================= */

.now-playing {
    background: #111;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    margin-top: 2px;
}

/* ============================= */
/* ADS */
/* ============================= */

.ad-box {
    width: 100%;
    max-width: 728px;
    min-height: 90px;
    margin: 20px auto;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #111;
    border-radius: 8px;
}

.ad-box iframe {
    max-width: 100%;
    border: 0;
}

/* ============================= */
/* SEARCH */
/* ============================= */

.search {
    width: 100%;
    padding: 14px;
    margin: 18px 0;
    border: none;
    border-radius: 8px;
    background: #181818;
    color: white;
    font-size: 16px;
    outline: none;
}

.search::placeholder {
    color: #888;
}

/* ============================= */
/* CHANNELS */
/* ============================= */

.channels {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
}

/* ============================= */
/* CHANNEL */
/* ============================= */

.channel {
    background: #151515;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: .2s;
    text-align: center;
    border: 1px solid #222;
}

.channel:hover {
    transform: translateY(-3px);
    background: #222;
}

.channel.active {
    background: #d90000;
    border-color: #ff3333;
}

/* ============================= */
/* CHANNEL LOGO */
/* ============================= */

.logo {
    width: 65px;
    height: 65px;
    object-fit: contain;
    display: block;
    margin: auto;
    margin-bottom: 8px;
    background: #000;
    border-radius: 8px;
}

/* ============================= */
/* NEWS SECTION */
/* ============================= */

.news-section {
    margin-top: 35px;
    padding: 20px 0;
}

.news-section h2 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 20px;
}

.news-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
}

.news-card {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 12px;
    overflow: hidden;
}

.news-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
}

.news-content {
    padding: 15px;
}

.news-content h3 {
    margin: 0 0 10px;
    font-size: 20px;
}

.news-content p {
    color: #bbb;
    line-height: 1.6;
    font-size: 15px;
}

.news-content a {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 14px;
    background: #d90000;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

.news-content a:hover {
    background: #ff2222;
}

/* ============================= */
/* FOOTER */
/* ============================= */

footer {
    text-align: center;
    color: #777;
    padding: 30px;
}

/* ============================= */
/* MOBILE */
/* ============================= */

@media(max-width:600px) {

    header {
        font-size: 20px;
    }

    .channels {
        grid-template-columns: repeat(2, 1fr);
    }

    .channel {
        font-size: 14px;
    }

    .news-container {
        grid-template-columns: 1fr;
    }

    .ad-box {
        min-height: 50px;
        margin: 15px auto;
    }

}

</style>

</head>


<body>

<!-- ============================= -->
<!-- CHANNEL JAVASCRIPT -->
<!-- ============================= -->

<script>

/* =========================================
   CHANNELS
========================================= */

const channels = [

    {
        name: "9X TASHAN",
        logo: "https://via.placeholder.com/100",
        url: "https://wiselp.wiseplayout.com/9X_Tashan/master.m3u8"
    },

    {
        name: "DEEPTO TV",
        logo: "https://via.placeholder.com/100",
        url: "https://byphdgllyk.gpcdn.net/hls/deeptotv/0_1/index.m3u8"
    },

    {
        name: "ENTER10 BANGLA",
        logo: "https://via.placeholder.com/100",
        url: "https://live-bangla.akamaized.net/liveabr/pub-iobanglakp3sff/live_240p/chunks.m3u8"
    },
   {
        name: "MUSIC",
        logo: "https://via.placeholder.com/100",
        url: "https://albportal.net/albkanalemusic.m3u8"
    },
    {
        name: "FOOTBALL",
        logo: "https://via.placeholder.com/100",
        url: "http://88.212.15.19/live/test_ctsport_25p/playlist.m3u8"
    },
     {
        name: "CINEMA",
        logo: "https://via.placeholder.com/100",
        url: "http://stream.mcquack.net/258/index.m3u8"
    },
    {
        name: "MOVIES-1",
        logo: "https://via.placeholder.com/100",
        url: "https://d1j2u714xk898n.cloudfront.net/scheduler/scheduleMaster/145.m3u8"
    }, 
    {
        name: "MOVIES-2",
        logo: "https://via.placeholder.com/100",
        url: "https://afrafhls.wns.live/hls/stream.m3u8"
    }, 
    {
        name: "BHUJPURI CINEMA",
        logo: "https://via.placeholder.com/100",
        url: "https://live-bhojpuri.akamaized.net/liveabr/playlist.m3u8"
    }, 
    {
        name: "MOVIES-3",
        logo: "https://via.placeholder.com/100",
        url: "https://live.presstv.ir/hls/ifilmen.m3u8"
    },
];


/* =========================================
   ELEMENTS
========================================= */

const video = document.getElementById("video");

const channelBox =
    document.getElementById("channels");

const nowPlaying =
    document.getElementById("nowPlaying");

const loading =
    document.getElementById("loading");

const search =
    document.getElementById("search");

let hls = null;


/* =========================================
   PLAY CHANNEL
========================================= */

function playChannel(channel, element) {

    nowPlaying.innerText =
        "🔴 LIVE — " + channel.name;


    document.querySelectorAll(".channel")
        .forEach(el => {

            el.classList.remove("active");

        });


    if (element) {

        element.classList.add("active");

    }


    loading.style.display = "block";


    /* Destroy old HLS */

    if (hls) {

        hls.destroy();

        hls = null;

    }


    /* Clear old video */

    video.pause();

    video.removeAttribute("src");

    video.load();


    /* ============================= */
    /* Safari / Native HLS */
    /* ============================= */

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = channel.url;


        video.play()
            .then(() => {

                loading.style.display = "none";

            })
            .catch(() => {

                loading.style.display = "none";

            });

    }


    /* ============================= */
    /* Chrome / Edge / Firefox */
    /* ============================= */

    else if (Hls.isSupported()) {

        hls = new Hls({

            enableWorker: true,

            lowLatencyMode: true,

            backBufferLength: 90

        });


        hls.loadSource(channel.url);


        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function () {

                loading.style.display = "none";

                video.play()
                    .catch(() => {});

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function (event, data) {

                console.log(
                    "HLS ERROR:",
                    data
                );


                if (data.fatal) {

                    loading.style.display = "none";

                    nowPlaying.innerText =
                        "⚠️ Stream cannot be played";

                }

            }
        );

    }


    else {

        loading.style.display = "none";

        alert(
            "Your browser does not support M3U8/HLS."
        );

    }

}


/* =========================================
   SHOW CHANNELS
========================================= */

function showChannels(list) {

    channelBox.innerHTML = "";


    if (list.length === 0) {

        channelBox.innerHTML =
            "<p>No channel found.</p>";

        return;

    }


    list.forEach(channel => {

        const div =
            document.createElement("div");


        div.className = "channel";


        div.innerHTML = `

            <img
                class="logo"
                src="${channel.logo}"
                onerror="this.style.display='none'"
                alt="${channel.name}"
            >

            <div>
                ${channel.name}
            </div>

        `;


        div.onclick = function () {

            playChannel(
                channel,
                div
            );

        };


        channelBox.appendChild(div);

    });

}


/* =========================================
   SEARCH
========================================= */

search.addEventListener(
    "input",
    function () {

        const keyword =
            search.value
                .toLowerCase()
                .trim();


        const filtered =
            channels.filter(channel =>

                channel.name
                    .toLowerCase()
                    .includes(keyword)

            );


        showChannels(filtered);

    }
);


/* =========================================
   START
========================================= */

showChannels(channels);

</script>


</body>

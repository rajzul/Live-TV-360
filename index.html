<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:#fff;
}

/* ================= HEADER ================= */

header{
    background:linear-gradient(90deg,#090909,#151515,#090909);
    padding:18px 15px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
    border-bottom:1px solid #292929;
}

/* ================= MAIN ================= */

.container{
    width:95%;
    max-width:1250px;
    margin:auto;
}

/* ================= TV PLAYER ================= */

.player-box{
    margin-top:20px;
    background:#000;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    box-shadow:0 8px 35px rgba(0,0,0,.45);
}

#video{
    width:100%;
    display:block;
    background:#000;
    aspect-ratio:16/9;
}

.loading{
    position:absolute;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.8);
    padding:12px 20px;
    border-radius:8px;
    display:none;
    z-index:5;
}

.now-playing{
    padding:13px;
    background:#151515;
    font-weight:bold;
    font-size:15px;
}

/* ================= SEARCH ================= */

.search-box{
    margin:20px 0;
}

.search-box input,
.movie-search input{
    width:100%;
    padding:15px 17px;
    border:1px solid #292929;
    outline:none;
    border-radius:9px;
    background:#161616;
    color:white;
    font-size:16px;
}

.search-box input:focus,
.movie-search input:focus{
    border-color:#e50914;
}

/* ================= SECTION ================= */

.section-title{
    margin-top:32px;
    margin-bottom:17px;
    font-size:23px;
}

/* ================= CHANNELS ================= */

.channels{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(150px,1fr));
    gap:15px;
}

.channel{
    background:#151515;
    border:1px solid #282828;
    border-radius:11px;
    padding:13px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.channel:hover{
    transform:translateY(-4px);
    background:#202020;
    border-color:#444;
}

.channel img{
    width:82px;
    height:82px;
    object-fit:contain;
    border-radius:8px;
    margin-bottom:8px;
}

.channel-name{
    font-weight:bold;
    font-size:14px;
}

/* ================================================= */
/* ================= MOVIE SECTION ================= */
/* ================================================= */

.movie-section{
    margin-top:50px;
    padding-bottom:50px;
}

.movie-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
}

.movie-heading h2{
    margin:0;
    font-size:25px;
}

.movie-heading span{
    color:#999;
    font-size:13px;
}

.movie-search{
    margin:20px 0;
}

.movie-status{
    color:#999;
    margin-bottom:18px;
    font-size:14px;
}

/* ================= MOVIE GRID ================= */

.movies{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(210px,1fr));
    gap:20px;
}

/* ================= MOVIE CARD ================= */

.movie-card{
    background:#141414;
    border:1px solid #252525;
    border-radius:13px;
    overflow:hidden;
    transition:.25s;
    position:relative;
}

.movie-card:hover{
    transform:translateY(-6px);
    border-color:#444;
    box-shadow:
        0 12px 35px rgba(0,0,0,.45);
}

.movie-poster-box{
    position:relative;
    background:#222;
    overflow:hidden;
}

.movie-poster{
    width:100%;
    height:300px;
    object-fit:cover;
    display:block;
    transition:.3s;
}

.movie-card:hover .movie-poster{
    transform:scale(1.03);
}

.movie-badge{
    position:absolute;
    top:10px;
    left:10px;
    background:#e50914;
    color:white;
    padding:6px 9px;
    border-radius:6px;
    font-size:11px;
    font-weight:bold;
}

.movie-info{
    padding:14px;
}

.movie-title{
    font-size:18px;
    font-weight:bold;
    line-height:1.3;
    margin-bottom:7px;
}

.movie-meta{
    color:#aaa;
    font-size:13px;
    margin-bottom:9px;
}

.movie-tags{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:10px;
}

.movie-tag{
    background:#292929;
    color:#ccc;
    padding:4px 7px;
    border-radius:5px;
    font-size:11px;
}

.movie-description{
    color:#bdbdbd;
    font-size:13px;
    line-height:1.5;
    min-height:58px;
}

.movie-buttons{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:13px;
}

.watch-btn,
.source-btn{
    border:none;
    padding:11px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    font-size:13px;
}

.watch-btn{
    background:#e50914;
    color:white;
}

.watch-btn:hover{
    background:#ff1722;
}

.source-btn{
    background:#292929;
    color:#fff;
}

.source-btn:hover{
    background:#383838;
}

/* ================= MOVIE MODAL ================= */

.movie-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.94);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:99999;
    padding:18px;
}

.movie-modal-box{
    width:100%;
    max-width:1100px;
    background:#111;
    border:1px solid #292929;
    border-radius:13px;
    overflow:hidden;
    position:relative;
    box-shadow:0 20px 80px rgba(0,0,0,.8);
}

.movie-close{
    position:absolute;
    right:12px;
    top:12px;
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.85);
    color:white;
    font-size:21px;
    cursor:pointer;
    z-index:10;
}

.movie-close:hover{
    background:#e50914;
}

.movie-video{
    width:100%;
    max-height:75vh;
    display:block;
    background:#000;
}

.movie-modal-info{
    padding:17px;
}

.movie-modal-info h2{
    margin:0 0 8px;
    font-size:22px;
}

.movie-modal-info p{
    margin:0;
    color:#aaa;
    line-height:1.5;
}

/* ================= EMPTY ================= */

.no-movie{
    padding:30px;
    background:#141414;
    border-radius:10px;
    text-align:center;
    color:#888;
}

/* ================= FOOTER ================= */

footer{
    text-align:center;
    color:#666;
    padding:30px 10px;
    border-top:1px solid #222;
    margin-top:20px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    header{
        font-size:21px;
    }

    .channels{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .channel{
        padding:10px;
    }

    .channel img{
        width:65px;
        height:65px;
    }

    .movies{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
        gap:11px;
    }

    .movie-poster{
        height:230px;
    }

    .movie-info{
        padding:10px;
    }

    .movie-title{
        font-size:15px;
    }

    .movie-description{
        font-size:11px;
        min-height:65px;
    }

    .movie-meta{
        font-size:11px;
    }

    .watch-btn,
    .source-btn{
        padding:9px 5px;
        font-size:11px;
    }

}

</style>
</head>


<body>

<header>
    📺 MY LIVE TV
</header>


<div class="container">

    <!-- ================================================= -->
    <!-- ================= TV PLAYER ===================== -->
    <!-- ================================================= -->

    <div class="player-box">

        <video
            id="video"
            controls
            playsinline>
        </video>

        <div
            id="loading"
            class="loading">
            ⏳ Loading...
        </div>

        <div
            id="nowPlaying"
            class="now-playing">
            Select a channel
        </div>

    </div>


    <!-- ================================================= -->
    <!-- ================= TV SEARCH ===================== -->
    <!-- ================================================= -->

    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="🔎 Search TV channel...">

    </div>


    <!-- ================================================= -->
    <!-- ================= TV CHANNELS =================== -->
    <!-- ================================================= -->

    <h2 class="section-title">
        📺 Live TV Channels
    </h2>

    <div
        id="channels"
        class="channels">
    </div>


    <!-- ================================================= -->
    <!-- ================= MOVIE SECTION ================= -->
    <!-- ================================================= -->

    <section class="movie-section">

        <div class="movie-heading">

            <h2>
                🎬 Free Full Movies
            </h2>

            <span>
                Public-domain / reusable sources
            </span>

        </div>


        <div class="movie-search">

            <input
                type="text"
                id="movieSearch"
                placeholder="🔎 Search movie, year, genre...">

        </div>


        <div
            id="movieStatus"
            class="movie-status">
            Loading movies...
        </div>


        <div
            id="movieContainer"
            class="movies">
        </div>

    </section>

</div>


<!-- ================================================= -->
<!-- ================= MOVIE MODAL ==================== -->
<!-- ================================================= -->

<div
    id="movieModal"
    class="movie-modal">

    <div class="movie-modal-box">

        <button
            id="movieClose"
            class="movie-close">
            ✕
        </button>


        <video
            id="movieVideo"
            class="movie-video"
            controls
            playsinline>
        </video>


        <div class="movie-modal-info">

            <h2 id="movieModalTitle">
                Movie
            </h2>

            <p id="movieModalDescription">
                Loading...
            </p>

        </div>

    </div>

</div>


<footer>
    © 2026 My Live TV
</footer>

<script>

const channels = [

    {
        name:"9X TASHAN",
        logo:"https://xstreamcp-assets-msp.streamready.in/assets/LIVETV/LIVECHANNEL/LIVETV_LIVETVCHANNEL_9X_TASHAN/images/LOGO_HD/image.png",
        url:"https://wiselp.wiseplayout.com/9X_Tashan/master.m3u8"
    },

    {
        name:"DEEPTO TV",
        logo:"https://www.freekaj.com/image/deepto-tv-logo/117",
        url:"https://byphdgllyk.gpcdn.net/hls/deeptotv/0_1/index.m3u8"
    },

    {
        name:"ENTER10 BANGLA",
        logo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Enterr10_LOGO-.png",
        url:"https://live-bangla.akamaized.net/liveabr/pub-iobanglakp3sff/live_240p/chunks.m3u8"
    },

    {
        name:"MUSIC",
        logo:"https://via.placeholder.com/100?text=MUSIC",
        url:"https://albportal.net/albkanalemusic.m3u8"
    },

    {
        name:"FOOTBALL",
        logo:"https://via.placeholder.com/100?text=FOOTBALL",
        url:"http://88.212.15.19/live/test_ctsport_25p/playlist.m3u8"
    },

    {
        name:"CINEMA",
        logo:"https://via.placeholder.com/100?text=CINEMA",
        url:"http://stream.mcquack.net/258/index.m3u8"
    },

    {
        name:"MOVIES-1",
        logo:"https://via.placeholder.com/100?text=MOVIES-1",
        url:"https://d1j2u714xk898n.cloudfront.net/scheduler/scheduleMaster/145.m3u8"
    },

    {
        name:"MOVIES-2",
        logo:"https://via.placeholder.com/100?text=MOVIES-2",
        url:"https://afrafhls.wns.live/hls/stream.m3u8"
    },

    {
        name:"BHUJPURI CINEMA",
        logo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Bhojpuri_Cinema_logo.png",
        url:"https://live-bhojpuri.akamaized.net/liveabr/playlist.m3u8"
    },

    {
        name:"MOVIES-3",
        logo:"https://via.placeholder.com/100?text=MOVIES-3",
        url:"https://live.presstv.ir/hls/ifilmen.m3u8"
    }

];


const video =
    document.getElementById("video");

const loading =
    document.getElementById("loading");

const nowPlaying =
    document.getElementById("nowPlaying");

const channelsContainer =
    document.getElementById("channels");

const searchInput =
    document.getElementById("search");


let hls = null;


function playChannel(channel){

    loading.style.display = "block";

    nowPlaying.textContent =
        "▶️ " + channel.name;


    if(hls){

        hls.destroy();

        hls = null;

    }


    if(Hls.isSupported()){

        hls = new Hls();

        hls.loadSource(channel.url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                loading.style.display = "none";

                video.play().catch(
                    ()=>{}
                );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(event,data){

                if(data.fatal){

                    loading.style.display = "none";

                    nowPlaying.textContent =
                        "❌ Unable to play " +
                        channel.name;

                }

            }
        );

    }

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            channel.url;

        video.addEventListener(
            "loadedmetadata",
            function(){

                loading.style.display = "none";

                video.play().catch(
                    ()=>{}
                );

            },
            {once:true}
        );

    }

    else{

        loading.style.display = "none";

        nowPlaying.textContent =
            "❌ HLS is not supported.";

    }

}


function showChannels(list){

    channelsContainer.innerHTML = "";


    if(list.length === 0){

        channelsContainer.innerHTML =
            "<p>No channel found.</p>";

        return;

    }


    list.forEach(
        channel => {

            const card =
                document.createElement("div");

            card.className =
                "channel";


            card.innerHTML = `

                <img
                    src="${channel.logo}"
                    alt="${channel.name}">

                <div class="channel-name">
                    ${channel.name}
                </div>

            `;


            card.addEventListener(
                "click",
                ()=>{
                    playChannel(channel);
                }
            );


            channelsContainer.appendChild(
                card
            );

        }
    );

}


searchInput.addEventListener(
    "input",
    function(){

        const value =
            this.value
                .toLowerCase()
                .trim();


        const filtered =
            channels.filter(
                channel =>
                    channel.name
                        .toLowerCase()
                        .includes(value)
            );


        showChannels(filtered);

    }
);


showChannels(channels);

</script>

<script>

/*
==========================================================
FREE MOVIE DATA
==========================================================

TMDB is NOT used.

Video files are hosted externally.
Always verify the source/license before commercial use.
*/


const freeMovies = [

    {
        title:"The General",
        year:"1926",
        date:"1926",
        genre:["Comedy","Silent","Classic"],
        runtime:"1h 15m",
        rating:"⭐ Public Domain",

        poster:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/The_General_(1926)_-_Movie_Poster.png",

        video:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/The_General_(1926).webm",

        source:
        "https://commons.wikimedia.org/wiki/File:The_General_(1926).webm",

        description:
        "A classic silent comedy starring Buster Keaton. The film follows a train engineer during the American Civil War."
    },


    {
        title:"Captain Kidd",
        year:"1945",
        date:"1945",
        genre:["Adventure","Drama","Classic"],
        runtime:"1h 28m",
        rating:"⭐ Public Domain",

        poster:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Captain_Kidd_(1945).jpg",

        video:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Captain_Kidd_(1945).webm",

        source:
        "https://commons.wikimedia.org/wiki/File:Captain_Kidd_(1945).webm",

        description:
        "A classic American adventure film starring Charles Laughton, Randolph Scott and Barbara Britton."
    }

];


const movieContainer =
    document.getElementById(
        "movieContainer"
    );


const movieStatus =
    document.getElementById(
        "movieStatus"
    );


const movieSearch =
    document.getElementById(
        "movieSearch"
    );


const movieModal =
    document.getElementById(
        "movieModal"
    );


const movieVideo =
    document.getElementById(
        "movieVideo"
    );


const movieClose =
    document.getElementById(
        "movieClose"
    );


const movieModalTitle =
    document.getElementById(
        "movieModalTitle"
    );


const movieModalDescription =
    document.getElementById(
        "movieModalDescription"
    );


/* ================= RENDER MOVIES ================= */


function renderMovies(list){

    movieContainer.innerHTML = "";


    movieStatus.textContent =
        list.length +
        " movie(s) available";


    if(list.length === 0){

        movieContainer.innerHTML = `
            <div class="no-movie">
                🔎 No movie found.
            </div>
        `;

        return;

    }


    list.forEach(
        movie => {

            const card =
                document.createElement("article");

            card.className =
                "movie-card";


            card.innerHTML = `

                <div class="movie-poster-box">

                    <img
                        class="movie-poster"
                        src="${movie.poster}"
                        alt="${movie.title}"
                        loading="lazy"
                        onerror="
                            this.src='https://via.placeholder.com/500x750/181818/ffffff?text=Movie';
                        "
                    >

                    <div class="movie-badge">
                        FREE
                    </div>

                </div>


                <div class="movie-info">

                    <div class="movie-title">
                        ${movie.title}
                    </div>


                    <div class="movie-meta">

                        📅 ${movie.date}
                        &nbsp; • &nbsp;
                        ⏱️ ${movie.runtime}

                    </div>


                    <div class="movie-tags">

                        ${movie.genre
                            .map(
                                g =>
                                `<span class="movie-tag">${g}</span>`
                            )
                            .join("")
                        }

                    </div>


                    <div class="movie-description">
                        ${movie.description}
                    </div>

            `;


            card
                .querySelector(".watch-btn")
                .addEventListener(
                    "click",
                    ()=>{
                        openMovie(movie);
                    }
                );


            card
                .querySelector(".source-btn")
                .addEventListener(
                    "click",
                    ()=>{

                        window.open(
                            movie.source,
                            "_blank",
                            "noopener,noreferrer"
                        );

                    }
                );


            movieContainer.appendChild(
                card
            );

        }
    );

}


/* ================= OPEN MOVIE ================= */


function openMovie(movie){

    movieModalTitle.textContent =
        `${movie.title} (${movie.year})`;


    movieModalDescription.textContent =
        `${movie.genre.join(" • ")} | ${movie.runtime} | ${movie.rating} — ${movie.description}`;


    movieVideo.pause();

    movieVideo.removeAttribute(
        "src"
    );

    movieVideo.load();


    movieVideo.src =
        movie.video;


    movieModal.style.display =
        "flex";


    movieVideo.load();


    movieVideo.play().catch(
        ()=>{}
    );

}


/* ================= CLOSE MOVIE ================= */


function closeMovie(){

    movieVideo.pause();

    movieVideo.removeAttribute(
        "src"
    );

    movieVideo.load();

    movieModal.style.display =
        "none";

}


movieClose.addEventListener(
    "click",
    closeMovie
);


movieModal.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            movieModal
        ){

            closeMovie();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeMovie();

        }

    }
);


/* ================= MOVIE SEARCH ================= */


movieSearch.addEventListener(
    "input",
    function(){

        const value =
            this.value
                .toLowerCase()
                .trim();


        const filtered =
            freeMovies.filter(
                movie => {

                    const text = (

                        movie.title +
                        " " +
                        movie.year +
                        " " +
                        movie.genre.join(" ") +
                        " " +
                        movie.description

                    ).toLowerCase();


                    return text.includes(value);

                }
            );


        renderMovies(filtered);

    }
);


/* ================= START ================= */

renderMovies(freeMovies);

</script>

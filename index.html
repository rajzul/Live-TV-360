header{

    position:sticky;
    top:0;

.container{
    max-width:1200px;
    margin:auto;
    padding:15px;
}

.section-title{
    font-size:24px;
    margin:20px 0 15px;
    font-weight:bold;
}

.search-box{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #333;
    background:#111;
    color:white;
    font-size:16px;
    outline:none;
    margin-bottom:18px;
}

.search-box:focus{
    border-color:#777;
}

.player-box{
    background:#000;
    border-radius:12px;
    overflow:hidden;
    border:1px solid #222;
    position:relative;
    margin-bottom:20px;
}

video{
    width:100%;
    max-height:600px;
    background:#000;
    display:block;
}

.loading{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.8);
    padding:12px 18px;
    border-radius:8px;
    display:none;
    z-index:5;
}

.now-playing{
    padding:12px;
    background:#111;
    font-size:16px;
    font-weight:bold;
}

.channels-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:15px;
}

.channel-card{
    background:#111;
    border:1px solid #292929;
    border-radius:12px;
    padding:12px;
    cursor:pointer;
    transition:.2s;
    text-align:center;
}

.channel-card:hover{
    transform:translateY(-3px);
    border-color:#666;
    background:#181818;
}

.channel-logo{
    width:100%;
    height:100px;
    object-fit:contain;
    background:#050505;
    border-radius:8px;
    margin-bottom:10px;
}

.channel-name{
    font-weight:bold;
    font-size:15px;
}

/* MOVIES */

.movie-section{
    margin-top:35px;
}

.movie-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:18px;
}

.movie-card{
    background:#111;
    border:1px solid #292929;
    border-radius:12px;
    overflow:hidden;
    transition:.2s;
}

.movie-card:hover{
    transform:translateY(-4px);
    border-color:#666;
}

.movie-poster{
    width:100%;
    height:270px;
    object-fit:cover;
    background:#191919;
    display:block;
}

.movie-info{
    padding:12px;
}

.movie-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:8px;
}

.movie-meta{
    font-size:13px;
    color:#bbb;
    margin-bottom:7px;
}

.movie-description{
    color:#aaa;
    font-size:13px;
    line-height:1.4;
    min-height:55px;
}

.movie-buttons{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:12px;
}

.watch-btn,
.source-btn{
    border:0;
    border-radius:8px;
    padding:10px;
    cursor:pointer;
    font-weight:bold;
}

.watch-btn{
    background:#e50914;
    color:#fff;
}

.watch-btn:hover{
    background:#ff1824;
}

.source-btn{
    background:#292929;
    color:#fff;
}

.source-btn:hover{
    background:#3a3a3a;
}

.movie-status{
    color:#aaa;
    margin-bottom:15px;

/* MODAL */

.movie-modal{
    display:none;
    position:fixed;

    z-index:2000;
    padding:20px;
    overflow:auto;

.movie-modal-content{

.movie-modal-description{

footer{

/* =====================================================

const video =
    document.getElementById("video");

const loading =
    document.getElementById("loading");

const nowPlaying =
    document.getElementById("nowPlaying");

const channelsContainer =
    document.getElementById("channels");

const searchInput =
    document.getElementById("search");

let hls = null;


function playChannel(channel){

    loading.style.display = "block";

    nowPlaying.textContent =
        "▶ " + channel.name;


    if(hls){

        hls.destroy();
        hls = null;

    }


    video.pause();

    video.removeAttribute("src");

    video.load();


    if(
        window.Hls &&
        Hls.isSupported()
    ){

        hls = new Hls();

        hls.loadSource(channel.url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                loading.style.display =
                    "none";

                video.play().catch(
                    function(){}
                );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(event,data){

                if(data.fatal){

                    loading.style.display =
                        "none";

                    nowPlaying.textContent =
                        "❌ Unable to play " +
                        channel.name;

                }

            }
        );

    }

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            channel.url;


        video.addEventListener(
            "loadedmetadata",
            function(){

                loading.style.display =
                    "none";

                video.play().catch(
                    function(){}
                );

            },
            {
                once:true
            }
        );

    }

    else{

        loading.style.display =
            "none";

        nowPlaying.textContent =
            "❌ HLS is not supported";

    }

}


/* =====================================================

===================================================== */

function showChannels(list){

    channelsContainer.innerHTML = "";


    if(list.length === 0){

        channelsContainer.innerHTML =
            '<div style="color:#aaa;padding:15px;">No channel found.</div>';

        return;

    }


    list.forEach(function(channel){

        const card =
            document.createElement("div");

        card.className =
            "channel-card";


        card.innerHTML = `

            <img
                class="channel-logo"
                src="${channel.logo}"
                alt="${channel.name}"
                loading="lazy"
                onerror="this.src='https://via.placeholder.com/200x120/111111/ffffff?text=TV'"
            >

            <div class="channel-name">
                ${channel.name}
            </div>

        `;


        card.addEventListener(
            "click",
            function(){

                playChannel(channel);

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            }
        );


        channelsContainer.appendChild(card);

    });

}

                    return channel.name

                        .includes(value);

            );


        showChannels(filtered);

    }
);

/* =====================================================
   MOVIE ELEMENTS
===================================================== */

const movieContainer =
    document.getElementById("movieContainer");

const movieSearch =
    document.getElementById("movieSearch");

const movieStatus =
    document.getElementById("movieStatus");

const movieModal =
    document.getElementById("movieModal");

const movieClose =
    document.getElementById("movieClose");

const movieVideo =
    document.getElementById("movieVideo");

const movieModalTitle =
    document.getElementById("movieModalTitle");

const movieModalDescription =
    document.getElementById("movieModalDescription");


/* =====================================================
   SHOW MOVIES
===================================================== */

function showMovies(list){

    movieContainer.innerHTML = "";

    movieStatus.textContent =
        list.length +
        " movie(s) available";


    if(list.length === 0){

        movieContainer.innerHTML =
            '<div style="color:#aaa;">No movie found.</div>';

        return;
    }


    list.forEach(function(movie){

        const card =
            document.createElement("div");

        card.className =
            "movie-card";


        const genres =
            movie.genre
            .map(function(g){

                return `
                    <span class="badge">
                        ${g}
                    </span>
                `;

            })
            .join("");


        card.innerHTML = `

            <img
                class="movie-poster"
                src="${movie.poster}"
                alt="${movie.title}"
                loading="lazy"
                onerror="this.src='https://via.placeholder.com/500x750/171717/ffffff?text=Movie'"
            >

            <div class="movie-info">

                <div class="movie-title">
                    ${movie.title}
                </div>

                <div class="movie-meta">
                    📅 ${movie.date}
                    &nbsp; • &nbsp;
                    ⏱️ ${movie.runtime}
                </div>

                <div>
                    ${genres}
                </div>

                <div class="movie-meta">
                    ${movie.rating}
                </div>

                <div class="movie-description">
                    ${movie.description}
                </div>

                <div class="movie-buttons">

                    <button
                        class="watch-btn"
                        type="button"
                    >
                        ▶ Watch Full Movie
                    </button>

                    <button
                        class="source-btn"
                        type="button"
                    >
                        ℹ️ Source / License
                    </button>

                </div>

            </div>

        `;


        card
        .querySelector(".watch-btn")
        .addEventListener(
            "click",
            function(){

                openMovie(movie);

            }
        );


        card
        .querySelector(".source-btn")
        .addEventListener(
            "click",
            function(){

                window.open(
                    movie.source,
                    "_blank",
                    "noopener,noreferrer"
                );

            }
        );


        movieContainer.appendChild(card);

    });

}


showMovies(freeMovies);


/* =====================================================
   MOVIE SEARCH
===================================================== */

movieSearch.addEventListener(
    "input",
    function(){

        const value =
            this.value
            .toLowerCase()
            .trim();


        const filtered =
            freeMovies.filter(
                function(movie){

                    return (

                        movie.title
                            .toLowerCase()
                            .includes(value)

                        ||

                        movie.year
                            .toLowerCase()
                            .includes(value)

                        ||

                        movie.description
                            .toLowerCase()
                            .includes(value)

                        ||

                        movie.genre
                            .join(" ")
                            .toLowerCase()
                            .includes(value)

                    );

                }
            );


        showMovies(filtered);

    }
);


/* =====================================================
   OPEN MOVIE
===================================================== */

function openMovie(movie){

    movieModalTitle.textContent =
        movie.title +
        " (" +
        movie.year +
        ")";


    movieModalDescription.innerHTML = `

        <p>
            ${movie.description}
        </p>

        <p>
            📅 Release year: ${movie.year}
        </p>

        <p>
            ⏱️ Runtime: ${movie.runtime}
        </p>

        <p>
            🎬 Genre:
            ${movie.genre.join(", ")}
        </p>

        <p>
            ⭐ ${movie.rating}
        </p>

        <p>
            <a
                href="${movie.source}"
                target="_blank"
                rel="noopener noreferrer"
                style="color:#4da6ff;"
            >
                ℹ️ View Source / License
            </a>
        </p>

    `;


    movieVideo.src =
        movie.video;


    movieModal.style.display =
        "block";


    document.body.style.overflow =
        "hidden";


    movieVideo.play().catch(
        function(){}
    );

}


/* =====================================================
   CLOSE MOVIE
===================================================== */

function closeMovie(){

    movieVideo.pause();

    movieVideo.removeAttribute("src");

    movieVideo.load();

    movieModal.style.display =
        "none";

    document.body.style.overflow =
        "";

}


movieClose.addEventListener(
    "click",
    closeMovie
);


movieModal.addEventListener(
    "click",
    function(event){

        if(
            event.target === movieModal
        ){

            closeMovie();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" &&
            movieModal.style.display === "block"
        ){

            closeMovie();

        }

    }
);

</script>

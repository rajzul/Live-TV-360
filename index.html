<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #111;

    color: #fff;

}


header {

    background: #1c1c1c;

    padding: 18px;

    text-align: center;

    font-size: 24px;

    font-weight: bold;

    border-bottom: 1px solid #333;

}


.container {

    width: 95%;

    max-width: 1200px;

    margin: auto;

}


/* =====================================================
   LIVE TV PLAYER
===================================================== */

.player-box {

    position: relative;

    width: 100%;

    background: #000;

    margin-top: 20px;

    border-radius: 10px;

    overflow: hidden;

}


#video {

    width: 100%;

    height: auto;

    min-height: 300px;

    background: #000;

}


.loading {

    position: absolute;

    top: 50%;

    left: 50%;

    transform: translate(-50%, -50%);

    display: none;

    background: rgba(0,0,0,.7);

    padding: 12px 20px;

    border-radius: 8px;

}


.now-playing {

    margin-top: 10px;

    padding: 12px;

    background: #1c1c1c;

    border-radius: 8px;

    text-align: center;

}


/* =====================================================
   ADS
===================================================== */

.ad-box {

    margin: 20px 0;

    text-align: center;

    min-height: 90px;

}


/* =====================================================
   CHANNEL SEARCH
===================================================== */

.search {

    width: 100%;

    padding: 14px;

    border: none;

    outline: none;

    border-radius: 8px;

    background: #222;

    color: #fff;

    font-size: 16px;

    margin: 15px 0;

}


.channels {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(150px, 1fr));

    gap: 15px;

}


.channel-card {

    background: #1c1c1c;

    border-radius: 10px;

    padding: 12px;

    text-align: center;

    cursor: pointer;

    transition: .2s;

    border: 1px solid #333;

}


.channel-card:hover {

    transform: translateY(-3px);

    background: #252525;

}


.channel-card img {

    width: 80px;

    height: 80px;

    object-fit: contain;

    border-radius: 8px;

    background: #000;

}


.channel-name {

    margin-top: 10px;

    font-weight: bold;

    font-size: 14px;

}


/* =====================================================
   FREE MOVIE SECTION
===================================================== */

.movie-section {

    margin-top: 35px;

    padding: 20px;

    background: #171717;

    border-radius: 12px;

}


.movie-section h2 {

    margin-top: 0;

    text-align: center;

}


.movie-search {

    width: 100%;

    padding: 14px;

    border: none;

    outline: none;

    border-radius: 8px;

    background: #252525;

    color: #fff;

    font-size: 16px;

    margin: 15px 0;

}


.movie-status {

    text-align: center;

    color: #bbb;

    padding: 10px;

}


.movie-container {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));

    gap: 18px;

}


.movie-card {

    background: #222;

    border-radius: 10px;

    overflow: hidden;

    border: 1px solid #333;

    transition: .2s;

}


.movie-card:hover {

    transform: translateY(-4px);

}


.movie-poster {

    width: 100%;

    height: 270px;

    object-fit: cover;

    display: block;

    background: #000;

}


.movie-info {

    padding: 12px;

}


.movie-title {

    font-size: 16px;

    font-weight: bold;

    margin-bottom: 8px;

}


.movie-meta {

    font-size: 13px;

    color: #bbb;

    line-height: 1.6;

    margin-bottom: 8px;

}


.movie-overview {

    font-size: 13px;

    color: #ccc;

    line-height: 1.5;

    display: -webkit-box;

    -webkit-line-clamp: 4;

    -webkit-box-orient: vertical;

    overflow: hidden;

}


/* =====================================================
   WATCH MOVIE BUTTON
===================================================== */

.watch-movie-btn {

    width: 100%;

    border: none;

    background: #e50914;

    color: #fff;

    padding: 11px;

    margin-top: 12px;

    border-radius: 6px;

    cursor: pointer;

    font-weight: bold;

}


.watch-movie-btn:hover {

    background: #b20710;

}


/* =====================================================
   SOURCE BUTTON
===================================================== */

.source-btn {

    width: 100%;

    border: none;

    background: #333;

    color: #ddd;

    padding: 9px;

    margin-top: 8px;

    border-radius: 6px;

    cursor: pointer;

}


.source-btn:hover {

    background: #444;

}


/* =====================================================
   MOVIE PLAYER MODAL
===================================================== */

.movie-modal {

    display: none;

    position: fixed;

    z-index: 99999;

    inset: 0;

    background: rgba(0,0,0,.90);

    align-items: center;

    justify-content: center;

    padding: 15px;

}


.movie-modal-box {

    width: 100%;

    max-width: 1000px;

    background: #111;

    position: relative;

    border-radius: 10px;

    overflow: hidden;

}


.movie-video {

    width: 100%;

    height: auto;

    max-height: 80vh;

    min-height: 300px;

    background: #000;

    display: block;

}


.movie-close {

    position: absolute;

    right: 10px;

    top: 8px;

    z-index: 2;

    width: 40px;

    height: 40px;

    border: none;

    border-radius: 50%;

    background: rgba(0,0,0,.85);

    color: #fff;

    font-size: 28px;

    cursor: pointer;

}


.movie-credit {

    text-align: center;

    color: #999;

    font-size: 12px;

    line-height: 1.5;

    margin-top: 18px;

}


/* =====================================================
   FOOTER
===================================================== */

footer {

    text-align: center;

    padding: 25px 10px;

    color: #888;

    margin-top: 30px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    header {

        font-size: 20px;

        padding: 15px;

    }


    #video {

        min-height: 220px;

    }


    .channels {

        grid-template-columns:
            repeat(2, 1fr);

    }


    .movie-container {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;

    }


    .movie-poster {

        height: 230px;

    }


    .movie-info {

        padding: 9px;

    }


    .movie-title {

        font-size: 14px;

    }


    .movie-overview {

        font-size: 12px;

    }


    .movie-video {

        min-height: 220px;

    }

}

</style>

<script>


const channels = [

    {

    }

];



const video =
    document.getElementById(
        "video"
    );


const loading =
    document.getElementById(
        "loading"
    );


const nowPlaying =
    document.getElementById(
        "nowPlaying"
    );


const channelsContainer =

        "channels"
    );


const searchInput =
    document.getElementById(
        "search"
    );


let hls = null;



/* =====================================================
   PLAY CHANNEL
===================================================== */

function playChannel(channel) {


    loading.style.display =
        "block";


    nowPlaying.innerHTML =
        "📺 Now Playing: <strong>" +
        channel.name +
        "</strong>";


    if (hls) {

        hls.destroy();

        hls = null;

    }


    if (Hls.isSupported()) {


        hls =
            new Hls();


        hls.loadSource(
            channel.url
        );


        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,

            function() {


                loading.style.display =
                    "none";


                video.play()
                    .catch(
                        function() {}
                    );

            }

        );


        hls.on(
            Hls.Events.ERROR,

            function(
                event,
                data
            ) {


                if (
                    data.fatal
                ) {


                    loading.style.display =
                        "none";


                    nowPlaying.innerHTML =
                        "❌ Unable to play " +
                        channel.name;

                }

            }

        );


    }


    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {


        video.src =
            channel.url;


        video.addEventListener(

            "loadedmetadata",

            function() {


                loading.style.display =
                    "none";


                video.play()
                    .catch(
                        function() {}
                    );

            },

            {
                once: true
            }

        );


    }


    else {


        loading.style.display =
            "none";


        nowPlaying.innerHTML =
            "❌ HLS is not supported in this browser.";

    }

}



/* =====================================================
   SHOW CHANNELS
===================================================== */

function showChannels(list) {


    channelsContainer.innerHTML =
        "";


    if (
        list.length === 0
    ) {


        channelsContainer.innerHTML =
            "<p>No channel found.</p>";


        return;

    }


    list.forEach(
        function(channel) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "channel-card";


            card.innerHTML = `

                <img

                    src="${channel.logo}"

                    alt="${channel.name}"

                    onerror="
                        this.src='https://via.placeholder.com/100'
                    "

                >

                <div
                    class="channel-name">

                    ${channel.name}

                </div>

            `;


            card.addEventListener(
                "click",

                function() {

                    playChannel(
                        channel
                    );

                }

            );


            channelsContainer.appendChild(
                card
            );

        }
    );

}



/* =====================================================
   CHANNEL SEARCH
===================================================== */

searchInput.addEventListener(
    "input",

    function() {


        const value =
            searchInput.value
                .toLowerCase()
                .trim();


        const filtered =
            channels.filter(

                function(channel) {


                    return channel.name
                        .toLowerCase()
                        .includes(value);

                }

            );


        showChannels(
            filtered
        );

    }

);



showChannels(
    channels
);

</script>



<!-- =====================================================
     FREE MOVIE JAVASCRIPT
===================================================== -->

<script>


/*
=========================================================
FREE MOVIE DATABASE

TMDB API IS NOT REQUIRED
=========================================================
*/


const freeMovies = [


    {
        title:
        "The General",

        year:
        "1926",

        date:
        "1926",

        rating:
        "⭐ Public Domain",

        poster:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/The_General_(1926)_-_Movie_Poster.png",

        video:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/The_General_(1926).webm",

        source:
        "https://commons.wikimedia.org/wiki/File:The_General_(1926).webm",

        description:
        "A classic silent comedy starring Buster Keaton."
    },


    {
        title:
        "His Girl Friday",

        year:
        "1940",

        date:
        "1940",

        rating:
        "⭐ Public Domain",

        poster:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/His_Girl_Friday_(1940).jpg",

        video:
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/His_Girl_Friday_(1940).ogv",

        source:
        "https://commons.wikimedia.org/wiki/File:His_Girl_Friday_(1940).ogv",

        description:
        "A classic American comedy starring Cary Grant and Rosalind Russell."
    }

];



/* =====================================================
   MOVIE ELEMENTS
===================================================== */

const movieContainer =
    document.getElementById(
        "movieContainer"
    );


const movieStatus =
    document.getElementById(
        "movieStatus"
    );


const movieSearch =
    document.getElementById(
        "movieSearch"
    );


const movieModal =
    document.getElementById(
        "movieModal"
    );


const movieVideo =
    document.getElementById(
        "movieVideo"
    );


const movieClose =
    document.getElementById(
        "movieClose"
    );



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeMovie(value) {


    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* =====================================================
   SHOW MOVIES
===================================================== */

function showMovies(list) {


    movieContainer.innerHTML =
        "";


    if (
        list.length === 0
    ) {


        movieContainer.innerHTML =
            "<p>No movie found.</p>";


        return;

    }


    list.forEach(
        function(movie) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "movie-card";


            card.innerHTML = `

                <img

                    class="movie-poster"

                    src="${movie.poster}"

                    alt="${escapeMovie(
                        movie.title
                    )}"

                    loading="lazy"

                    onerror="
                        this.src='https://via.placeholder.com/500x750?text=Movie'
                    "

                >


                <div
                    class="movie-info">


                    <div
                        class="movie-title">

                        ${escapeMovie(
                            movie.title
                        )}

                    </div>


                    <div
                        class="movie-meta">

                        📅 ${escapeMovie(
                            movie.date
                        )}

                        <br>

                        ${escapeMovie(
                            movie.rating
                        )}

                    </div>


                    <div
                        class="movie-overview">

                        ${escapeMovie(
                            movie.description
                        )}

                    </div>


                    <button
                        class="watch-movie-btn">

                        ▶ Watch Full Movie

                    </button>


                    <button
                        class="source-btn">

                        ℹ️ Source / License

                    </button>


                </div>

            `;



            /* WATCH BUTTON */

            const watchButton =
                card.querySelector(
                    ".watch-movie-btn"
                );


            watchButton.addEventListener(

                "click",

                function() {

                    openMovie(
                        movie.video
                    );

                }

            );



            /* SOURCE BUTTON */

            const sourceButton =
                card.querySelector(
                    ".source-btn"
                );


            sourceButton.addEventListener(

                "click",

                function() {


                    window.open(

                        movie.source,

                        "_blank"

                    );

                }

            );


            movieContainer.appendChild(
                card
            );

        }
    );

}



/* =====================================================
   OPEN FULL MOVIE
===================================================== */

function openMovie(url) {


    if (!url) {


        alert(
            "Movie video URL is not available."
        );


        return;

    }


    movieVideo.pause();


    movieVideo.src =
        url;


    movieModal.style.display =
        "flex";


    movieVideo.play()
        .catch(
            function() {}
        );

}



/* =====================================================
   CLOSE MOVIE
===================================================== */

function closeMovie() {


    movieVideo.pause();


    movieVideo.removeAttribute(
        "src"
    );


    movieVideo.load();


    movieModal.style.display =
        "none";

}



/* =====================================================
   CLOSE BUTTON
===================================================== */

movieClose.addEventListener(

    "click",

    closeMovie

);



/* =====================================================
   CLICK OUTSIDE
===================================================== */

movieModal.addEventListener(

    "click",

    function(event) {


        if (
            event.target ===
            movieModal
        ) {


            closeMovie();

        }

    }

);



/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(

    "keydown",

    function(event) {


        if (
            event.key ===
            "Escape"
        ) {


            closeMovie();

        }

    }

);



/* =====================================================
   MOVIE SEARCH
===================================================== */

movieSearch.addEventListener(

    "input",

    function() {


        const value =
            movieSearch.value
                .toLowerCase()
                .trim();


        const filtered =
            freeMovies.filter(

                function(movie) {


                    return (

                        movie.title
                            .toLowerCase()
                            .includes(
                                value
                            )

                        ||

                        movie.year
                            .includes(
                                value
                            )

                    );

                }

            );


        showMovies(
            filtered
        );

    }

);



/* =====================================================
   START MOVIES
===================================================== */

showMovies(
    freeMovies
);


movieStatus.innerHTML =
    "🎬 " +
    freeMovies.length +
    " free/public-domain movies";

</script>
